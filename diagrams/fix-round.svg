<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 336 802" width="420" height="1002" role="img" aria-labelledby="fix-round-title fix-round-desc">
<title id="fix-round-title">The fix round</title>
<desc id="fix-round-desc">The fix round sorts each finding into one route, puts each Owner finding and each Past commit finding to the owner, and runs the Fix and Test first findings in five parts.</desc>
<style>
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #15202b; --ink-soft: #364250;
  --muted: #5a6673; --owner: #a23468; --owner-tint: #f8e4ed;
  --font-sans: "IBM Plex Sans", "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto,
    sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f151b; --surface: #17202a; --ink: #e4eaf0; --ink-soft: #c3cdd7;
    --muted: #97a4b1; --owner: #e687b5; --owner-tint: #3b1c2c;
  }
}
.dg { font-family: var(--font-sans); font-size: 13px; }
.d-bg { fill: var(--bg); }
.d-flow { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.d-arrowhead, .d-start, .d-end-dot, .d-junction, .d-session { fill: var(--ink); }
.d-end, .d-step, .d-decision, .d-subagent {
  fill: var(--surface); stroke: var(--ink); stroke-width: 1.6;
}
.d-owner-mark { fill: var(--owner-tint); stroke: var(--owner); stroke-width: 1.2; }
.d-owner-bar { fill: var(--owner); }
.d-box { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
.d-box-owner { fill: var(--owner-tint); stroke: var(--owner); stroke-width: 1.2; }
.d-chip-agent { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
.d-chip-owner { fill: var(--owner-tint); stroke: var(--owner); stroke-width: 1; }
.d-name { font-size: 14px; font-weight: 600; fill: var(--ink); }
.d-label { font-weight: 600; fill: var(--ink); }
.d-text { font-weight: 400; fill: var(--ink-soft); }
.d-pass { font-style: italic; font-weight: 400; fill: var(--ink-soft); }
.d-num { font-weight: 700; fill: var(--ink); }
.d-cond, .d-cond-owner, .d-chip-agent-text, .d-chip-owner-text {
  font-weight: 700; letter-spacing: 0.06em;
}
.d-cond { fill: var(--muted); }
.d-cond-owner, .d-chip-owner-text { fill: var(--owner); }
.d-chip-agent-text { fill: var(--ink-soft); }
</style>
<defs><marker id="fix-round-arrow" viewBox="0 0 8 6" refX="5" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="d-arrowhead" d="M0 0L8 3L0 6z"/></marker></defs>
<rect class="d-bg" x="0" y="0" width="336" height="802" rx="8"/>

<!-- Flow lines: the spine, the three taps, the two returns from the owner, the five parts. -->
<path class="d-flow" d="M 36 30 V 59" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 74 V 500" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 132 H 57" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 224 H 57" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 361 H 57" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 84 276 V 278 Q 84 284 78 284 H 42" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 84 422 V 446 Q 84 452 78 452 H 42" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 517 V 596" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 613 V 654" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 675 V 701" marker-end="url(#fix-round-arrow)"/>
<path class="d-flow" d="M 36 716 V 760" marker-end="url(#fix-round-arrow)"/>

<!-- Boxes: a lead ends its branch; an Owner finding comes back. -->
<rect class="d-box" x="60" y="108" width="260" height="48" rx="6"/>
<rect class="d-box-owner" x="60" y="172" width="260" height="104" rx="6"/>
<rect class="d-owner-mark" x="290" y="179" width="18" height="18" rx="4"/>
<rect class="d-owner-bar" x="295" y="183.5" width="2.5" height="9"/>
<rect class="d-owner-bar" x="300.5" y="183.5" width="2.5" height="9"/>
<rect class="d-box-owner" x="60" y="300" width="260" height="122" rx="6"/>
<rect class="d-owner-mark" x="290" y="307" width="18" height="18" rx="4"/>
<rect class="d-owner-bar" x="295" y="311.5" width="2.5" height="9"/>
<rect class="d-owner-bar" x="300.5" y="311.5" width="2.5" height="9"/>

<!-- Marks on the spine. -->
<circle class="d-start" cx="36" cy="24" r="6"/>
<rect class="d-session" x="30" y="62" width="12" height="12" rx="2"/>
<circle class="d-junction" cx="36" cy="132" r="3"/>
<circle class="d-junction" cx="36" cy="224" r="3"/>
<circle class="d-junction" cx="36" cy="284" r="3"/>
<circle class="d-junction" cx="36" cy="361" r="3"/>
<circle class="d-junction" cx="36" cy="452" r="3"/>
<rect class="d-subagent" x="29" y="503" width="14" height="14" rx="3"/>
<rect class="d-subagent" x="29" y="599" width="14" height="14" rx="3"/>
<polygon class="d-decision" points="36 657 45 666 36 675 27 666"/>
<rect class="d-session" x="30" y="704" width="12" height="12" rx="2"/>
<circle class="d-end" cx="36" cy="770" r="7"/>
<circle class="d-end-dot" cx="36" cy="770" r="3"/>

<!-- Text. -->
<text class="d-label" x="52" y="29">Verify has findings</text>
<text class="d-label" x="52" y="73">The session sorts each finding</text>
<text class="d-text" x="52" y="91">into one route</text>

<text class="d-cond" x="72" y="127">LEAD</text>
<text class="d-label" x="72" y="145">The report only lists it</text>

<text class="d-cond-owner" x="72" y="191">OWNER</text>
<text class="d-label" x="72" y="209">The session asks the owner</text>
<text class="d-text" x="72" y="227">before the code writer starts</text>
<text class="d-text" x="72" y="245">The answer moves it to Fix or</text>
<text class="d-text" x="72" y="263">Test first, or closes it</text>

<text class="d-cond-owner" x="72" y="319">PAST COMMIT</text>
<text class="d-label" x="72" y="337">The session asks the owner</text>
<text class="d-text" x="72" y="355">one question per commit</text>
<text class="d-text" x="72" y="373">Keep closes it. Fix it in a new</text>
<text class="d-text" x="72" y="391">commit moves it to Fix.</text>
<text class="d-text" x="72" y="409">A message gets Keep or Stop</text>

<text class="d-cond" x="52" y="480">FIX AND TEST FIRST</text>

<text class="d-label" x="52" y="515">(1) One fresh test writer</text>
<text class="d-text" x="52" y="533">tests for the Test first findings</text>
<text class="d-text" x="52" y="551">then the red check, and the</text>
<text class="d-text" x="52" y="569">session makes a tests commit</text>
<text class="d-label" x="52" y="611">(2) One fresh code writer</text>
<text class="d-text" x="52" y="629">every Fix and Test first finding</text>
<text class="d-label" x="52" y="671">(3) Test-lock check</text>
<text class="d-label" x="52" y="715">(4) The session commits the fix</text>
<text class="d-text" x="52" y="733">after the test command passes</text>
<text class="d-label" x="52" y="775">(5) Verify runs once more</text>
</svg>
